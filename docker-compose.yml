version: '3.9'

services:

  db:
    image: mysql:8.0
    container_name: exposiciones_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE:      exposiciones_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: exposiciones_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST:     db
      DB_PORT:     3306
      DB_USER:     root
      DB_PASSWORD: root1234
      DB_NAME:     exposiciones_db
      JWT_SECRET:  exposiciones_secret_2025
      PORT:        8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
